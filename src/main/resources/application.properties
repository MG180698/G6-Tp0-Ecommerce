spring.application.name=TPO-Ecommerce-Grupo6

# ============================================================
# Base de datos por defecto: H2 en memoria.
# No hay que instalar nada para levantar el proyecto.
# Los datos se pierden al parar la app: eso es esperado.
# Consola web: http://localhost:8080/h2-console
# ============================================================
spring.datasource.url=jdbc:h2:mem:ecommercedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
# JPA / Hibernate
# ddl-auto=update: Hibernate crea y actualiza las tablas a partir
# de las clases @Entity. No hay que escribir SQL a mano.
# show-sql: imprime en consola cada query que ejecuta.
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# Respuestas de error
# DevTools activa el stacktrace completo en las respuestas de error, asi que un
# 404 le llega al cliente con decenas de KB de traza de Java: nombres de clase,
# numeros de linea y toda la cadena de proxies de Spring. Es ilegible para el
# front y expone la estructura interna del backend.
# El mensaje del error se sigue viendo; lo que se corta es la traza.
# ============================================================
server.error.include-stacktrace=never

# Se deja en true (el valor por defecto) solo para silenciar el WARN del arranque.
# Mantiene la sesion de JPA abierta durante la respuesta, asi las relaciones LAZY
# se pueden leer sin romper. Es lo mas comodo mientras aprendemos.
spring.jpa.open-in-view=true
