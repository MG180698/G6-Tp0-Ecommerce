# ============================================================
# Perfil MySQL. NO se usa por defecto.
#
# Se activa con:
#   .\mvnw spring-boot:run "-Dspring-boot.run.profiles=mysql"
#
# Requiere un MySQL escuchando en localhost:3306. La forma mas
# simple es el contenedor de Docker de la clase 03:
#
#   docker run --name mysql-uade -e MYSQL_ALLOW_EMPTY_PASSWORD=yes \
#     -p 3306:3306 -d mysql:8.0
#
# La base se llama ecommerce_tpo y la crea sola el driver
# (createDatabaseIfNotExist=true). Se usa un nombre propio a proposito, para no
# pisar bases de otras practicas de la materia que puedan estar en el mismo
# contenedor con un esquema viejo: si Hibernate encuentra tablas que no
# coinciden con las @Entity, las mezcla en vez de reemplazarlas.
#
# A diferencia de H2, aca los datos sobreviven al reinicio de la app.
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_tpo?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.h2.console.enabled=false
